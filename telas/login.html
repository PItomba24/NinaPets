<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PetFeeder - Login</title>

    <link rel="stylesheet" href="../estilos/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                <div class="logo-circulo">
                    🐾
                </div>
            </div>

            <h1>Pet<span>Feeder</span></h1>

            <h2>Entrar</h2>

            <p class="descricao">
                Entre na sua conta para continuar.
            </p>

            <form id="loginForm">

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn-entrar">
                    Entrar
                </button>

            </form>

            <button id="btnRecuperar" class="link-button">
                Esqueci minha senha
            </button>

            <div class="divisor">
                <span>ou</span>
            </div>

            <p class="cadastro-texto">
                Ainda não possui uma conta?
            </p>

            <button id="btnCadastro" class="btn-cadastro">
                Criar uma conta
            </button>

        </section>

    </main>

    <script src="../scripts/login.js"></script>

</body>

</html>
